language-version: "0.1.0"
dashboard:
  id: stale-review-follow-up
  title: Stale review follow-up
  defaults:
    scope:
      repositories:
        - githubnext/gh-aw-cao
      workflows:
        - .github/workflows/stale-review-follow-up.yml
    time:
      range: 30d
  units:
    ratio:
      name: Ratio
      symbol: ratio
      significant: 0.01
      format: number
  queries:
    - name: stale-review-attainment-runs
      intent: Select workflow runs and bind each run to its native stale-review follow-up attainment metric so operators can see activation, execution, and missing attainment evidence for this workflow.
      description: Workflow runs joined with their native operational-grader attainment value when present.
      from: runs
      joins:
        - source: operational-graders
          type: left
          on:
            - left: organization
              right: organization
            - left: repository
              right: repository
            - left: workflow
              right: workflow
            - left: run
              right: run
          fields:
            - field: operational-grader
              as: attainment
            - field: observed-at
              as: attainment-observed-at
      select:
        - field: organization
        - field: repository
        - field: workflow
        - field: run
        - field: started-at
        - field: run-status
        - field: run-conclusion
        - field: rollout-mode
        - field: run-link
        - field: attainment
        - field: attainment-observed-at
  pages:
    - id: stale-review-follow-up
      kind: custom
      title: Stale review follow-up
      description: Shows whether the stale-review follow-up workflow activates on stale pull-request review opportunities, produces bounded pull-request reminders, and attains its native follow-up metric.
      filter-bar: true
      sections:
        - id: stale-review-summary
          title: Stale review follow-up summary
          description: Executive summary of recent workflow execution, outcome states, actionable exceptions, and attainment for this workflow.
          layout: full
          views:
            - stale-review-outcome-disposition
            - stale-review-activation-trend
            - stale-review-pending-reminders
            - stale-review-attainment-trend
            - stale-review-exceptions
      views:
        - id: stale-review-outcome-disposition
          title: Outcome disposition
          description: Current distribution of pull-request outcome states for stale-review follow-up runs in the selected horizon.
          data:
            source: outcomes
            filters:
              outcome-category: pull-request
          mark: chart
          chart: pie
          layout: full
          disclosure: essential
          encoding:
            x:
              field: outcome-state
              type: ordinal
              title: Outcome state
            y:
              field: safe-output
              type: quantitative
              aggregate: count
              title: Outcomes
        - id: stale-review-activation-trend
          title: Activation trend
          description: Daily workflow runs show whether the stale-review follow-up workflow is activating on pull-request stale-review opportunities.
          data:
            source: runs
          mark: chart
          chart: line
          layout: half
          disclosure: essential
          encoding:
            x:
              field: started-at
              type: temporal
              time-unit: day
              title: Started
            y:
              field: run
              type: quantitative
              aggregate: distinct-count
              title: Runs
        - id: stale-review-pending-reminders
          title: Pending or ignored follow-up outputs
          description: Pull-request outcomes that still need operator attention because the reminder output is pending or ignored.
          data:
            source: outcomes
            filters:
              outcome-category: pull-request
              outcome-state:
                - pending
                - ignored
            order-by:
              - field: observed-at
                direction: desc
              - field: outcome-number
                direction: asc
            limit: 20
          mark: table
          controls: interactive
          layout: full
          disclosure: essential
          empty-message: No pending or ignored stale-review follow-up outputs match the selected horizon.
          encoding:
            href:
              field: pull-request-link
              type: nominal
            columns:
              - field: outcome-title
                type: nominal
                title: Pull request
                display: outcome-link
              - field: outcome-number
                type: quantitative
                title: Number
              - field: outcome-state
                type: ordinal
                title: State
                display: status
              - field: evidence-strength
                type: ordinal
                title: Evidence
                display: status
              - field: run-conclusion
                type: ordinal
                title: Run conclusion
                display: status
              - field: observed-at
                type: temporal
                title: Observed
                format: human-friendly-timestamp
        - id: stale-review-attainment-trend
          title: Stale-review follow-up attainment
          description: Native gh-aw attainment values show whether recent workflow runs achieved the intended stale-review follow-up effect.
          data:
            source: stale-review-attainment-runs
          mark: chart
          chart: line
          layout: half
          disclosure: essential
          encoding:
            x:
              field: started-at
              type: temporal
              time-unit: day
              title: Run started
            y:
              field: attainment
              type: quantitative
              aggregate: mean
              title: Mean attainment
              unit: ratio
        - id: stale-review-exceptions
          description: Findings linked to stale-review follow-up runs identify actionable execution exceptions that can block or weaken follow-up evidence.
          data:
            source: findings
            order-by:
              - field: observed-at
                direction: desc
            limit: 20
          mark: table
          controls: interactive
          layout: full
          disclosure: supplemental
          empty-message: No linked findings were observed for stale-review follow-up runs in the selected horizon.
          encoding:
            href:
              field: run-link
              type: nominal
            columns:
              - field: finding-summary
                type: nominal
                title: Finding
              - field: finding-severity
                type: ordinal
                title: Severity
                display: status
              - field: finding-status
                type: ordinal
                title: Status
                display: status
              - field: run
                type: quantitative
                title: Run
              - field: observed-at
                type: temporal
                title: Observed
                format: human-friendly-timestamp
